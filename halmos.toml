# Halmos configuration (https://github.com/a16z/halmos)
#
# Halmos reads this file automatically when you run `halmos` from the repo root, so the plain command
# `halmos` picks up the settings below with no extra flags. Every key here mirrors a `--<key>` CLI
# option (dashes become underscores), and anything passed on the command line overrides this file.
[global]

# Only run functions whose name contains this string. Our Halmos tests use the canonical `check_`
# prefix, which also keeps them separate from Foundry's `test*` / `invariant_*` functions.
function = "check_"

# Only load contracts whose name matches this regex (Halmos anchors it as ^...$). We deliberately pin
# this to the sound proof(s) only, so a plain `halmos` — and CI — runs exactly the properties we stand
# behind. The two teaching artifacts remain in the repo but are EXCLUDED here because they demonstrate
# Halmos *failure modes* rather than proving anything:
#   - DvpUnboundedHalmos   passes but WARNS "loop unrolling bound exceeded" (unsound pass)
#   - SolverLimitsHalmos   times out the solver (nonlinear / factorization query)
# Run those explicitly when teaching/exploring, e.g. `halmos --contract DvpUnboundedHalmos`.
# To add a future sound proof, GROUP the alternation so the ^...$ anchoring stays correct, e.g.
# "(DvpEthBalanceHalmos|DvpFooHalmos)" or "Dvp(EthBalance|Foo)Halmos". A bare "A|B" anchors as
# ^A|B$ = (^A)|(B$), which matches unintended contracts (anything ending in B) — not what you want.
contract = "DvpEthBalanceHalmos"

# Maximum number of iterations to unroll bounded loops. The ETH-only single-flow path only loops once,
# so 4 is generous headroom; raise it if you add tests with more flows/settlements.
loop = 4

# Print a per-test summary (paths explored, solver queries). Helpful while learning what Halmos does.
verbose = 1
